name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The website's changelog page is written from CHANGELOG.md: it must match it.
      - name: The changelog page matches CHANGELOG.md
        run: |
          pnpm docs:changelog
          git diff --exit-code docs/changelog || { echo "Run pnpm docs:changelog and commit docs/changelog"; exit 1; }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Packs the server like npm publish, installs it into an empty folder and runs it there (builds first).
      - run: pnpm check:pack
