name: Idea or feature request
description: Something Sitewright should do, or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you were building in Framer, and where Sitewright got in the way or fell short.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A workaround, another tool, or doing it by hand in the editor.
